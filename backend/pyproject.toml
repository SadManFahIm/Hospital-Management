[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
# Practical, high-signal rule set. Cosmetic/noise rules are deliberately
# excluded or ignored so the gate stays useful without broad churn.
#   F    pyflakes: unused imports, undefined names, redefinitions
#   E/W  pycodestyle errors/warnings (line length, whitespace, etc.)
#   I    isort: import ordering
#   B    bugbear: common bug patterns
#   RUF  ruff-specific (unused noqa, etc.)
select = ["E", "F", "W", "I", "B", "RUF"]
ignore = [
    # B008: FastAPI idiom is to call Depends() in parameter defaults.
    "B008",
    # B905: zip() without strict= is intentional/irrelevant here.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# alembic env.py imports app modules after the sys.path insertion.
"alembic/env.py" = ["E402"]
# Autogenerated alembic migrations are not edited by hand.
"alembic/versions/*" = ["E", "W", "I"]
"tests/*" = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
# Check the Phase-2 infrastructure core + schemas. Imported ORM/service modules
# (app.models, app.services, app.api) are followed for type info but their
# errors are not reported: they use the classic SQLAlchemy `Column`-attribute
# style whose mapper types conflict with instance assignments. Migrating them to
# the `Mapped[...]` annotation style is a deferred, cross-cutting refactor.
follow_imports = "silent"
ignore_missing_imports = true
files = [
    "app/core/config.py",
    "app/core/log.py",
    "app/core/middleware.py",
    "app/core/security.py",
    "app/core/database.py",
    "app/schemas/__init__.py",
]
