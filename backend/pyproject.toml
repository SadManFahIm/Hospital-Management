[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "RUF"]
ignore = [
    "B008",
    "B905",
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
"alembic/versions/*" = ["E", "W", "I"]
"tests/*" = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
follow_imports = "silent"
ignore_missing_imports = true
files = [
    "app/core/config.py",
    "app/core/log.py",
    "app/core/security.py",
    "app/core/database.py",
    "app/schemas/__init__.py",
]